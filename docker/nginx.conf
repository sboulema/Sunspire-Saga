server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # The game, CSS and site script change with each release; let the browser revalidate them.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Art never changes without a new filename, so cache it hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
