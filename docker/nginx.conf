server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative, so they keep the scheme and host of a TLS proxy in front.
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # Clean URLs: /index and /index.html go to /, /play.html goes to /play (query string kept).
    # Matched on $request_uri so the internal index.html lookup for / doesn't loop.
    if ($request_uri ~ ^/index(\.html)?(\?|$)) {
        return 301 /$is_args$args;
    }
    if ($request_uri ~ ^/(.+)\.html(\?|$)) {
        return 301 /$1$is_args$args;
    }

    # /play serves play.html. The pages change with each release; let the browser revalidate them.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # The game, CSS and site script change with each release too.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Art never changes without a new filename, so cache it hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
