server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative, so they keep the scheme and host of a TLS proxy in front.
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Clean URLs: /index and /index.html go to /, /play.html goes to /play (query string kept).
    # Matched on $request_uri so the internal index.html lookup for / doesn't loop.
    if ($request_uri ~ ^/index(\.html)?(\?|$)) {
        return 301 /$is_args$args;
    }
    if ($request_uri ~ ^/([a-z-]+)\.html(\?|$)) {
        return 301 /$1$is_args$args;
    }

    # /play serves play.html. The pages change with each release; let the browser revalidate them.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # The app manifest, with its own media type (not in every nginx mime.types).
    location = /static/manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Pages, scripts, styles, the bundle, the game data and the service worker change with each release.
    location ~* \.(html|js|css|json|fnt)$ {
        add_header Cache-Control "no-cache";
    }

    # Art and sound never change without a new build, and the service worker versions them; cache for a week.
    location ~* \.(png|jpg|gif|webp|ico|wav|ogg)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
