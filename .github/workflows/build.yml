# Build the engine build of Sunspire Saga: format check, type-checked build, production bundle,
# then the static site as a workflow artifact. Every push to main deploys that site to GitHub
# Pages (Settings -> Pages -> Source: GitHub Actions); a manual run with the deploy option does
# the same from any branch.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy the site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format-check
      - run: npm run build
      - run: npm run site
      - uses: actions/upload-artifact@v7
        with:
          name: sunspire-saga-site-${{ github.sha }}
          path: site
      - if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # enables Pages with the Actions source the first time, no-op after that
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v5
