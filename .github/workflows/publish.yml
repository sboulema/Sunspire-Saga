# Publish the game: a Docker image on Docker Hub and a zip of the static site.
#
#   push to main      ->  image <user>/sunspire-saga:latest and :sha-<short sha>
#                         + workflow artifact "sunspire-saga-sha-<short sha>" (the site, zipped)
#   push of tag vNN   ->  image <user>/sunspire-saga:vNN and :sha-<short sha>
#                         + a GitHub Release for vNN with sunspire-saga-vNN.zip attached
#
# The Docker job needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access
# token, Docker Hub -> Account settings -> Personal access tokens, with Read & Write scope).
#
# The zip unpacks straight into a web root: the HTML pages, game.js, assets/ and the licence.
# Keep SITE_FILES in step with the COPY lines in the Dockerfile.
name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_FILES: index.html play.html pack-guide.html changelog.html walkthrough.html game.js LICENSE assets

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sunspire-saga
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  site-zip:
    name: Static site zip
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release on a tag
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Pick the release name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="sha-${GITHUB_SHA::7}"; fi
          echo "name=sunspire-saga-$v" >> "$GITHUB_OUTPUT"

      - name: Stage and zip the site
        run: |
          mkdir -p site dist
          cp -r $SITE_FILES site/
          (cd site && zip -r -X "../dist/${{ steps.version.outputs.name }}.zip" .)
          unzip -l "dist/${{ steps.version.outputs.name }}.zip" | tail -1

      # Every run: the staged site as a workflow artifact (GitHub serves it as a zip).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: site
          if-no-files-found: error

      # Tags only: a GitHub Release with the zip attached.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
