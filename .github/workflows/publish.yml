# Publish a release of the game. Runs on a vNN tag only (the Build workflow covers every push):
#
#   push of tag vNN   ->  images <user>/sunspire-saga and ghcr.io/<owner>/sunspire-saga,
#                         tagged :vNN, :latest and :sha-<short sha>
#                         + a GitHub Release for vNN with sunspire-saga-vNN.zip attached
#                         + the site uploaded over SFTP to the web host
#
# A manual run (workflow_dispatch) rebuilds the images, tagged :sha-<short sha>; with the
# "deploy_ftp" option it instead builds the site from the chosen branch and uploads it over SFTP,
# without a GitHub Release. That is how to test the upload settings without tagging a version:
# such a run also prints lftp's whole SFTP dialogue.
#
# GHCR uses the workflow's own GITHUB_TOKEN and always gets the image. Docker Hub is optional: it
# is pushed only when the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are set (an
# access token, Docker Hub -> Account settings -> Personal access tokens, with Read & Write scope).
#
# The SFTP deploy is optional too: it runs only when the repository secrets FTP_SERVER (the host
# name), FTP_USERNAME and FTP_PASSWORD are set. FTP_PATH (secret, optional) is the folder on the
# server to upload into, the login folder by default. FTP_PORT (repository variable, optional)
# is the SSH port, 22 by default. The server's host key is taken from the server on first
# contact (ssh-keyscan); to pin it instead, put its known_hosts line(s) in the optional secret
# FTP_KNOWN_HOSTS.
# The upload is an lftp mirror: files on the server that are not in the site are deleted from
# that folder, except dotfiles (.htaccess, .well-known) and cgi-bin, so point it at a folder that
# holds only the site.
#
# The zip is the output of `npm run site` (scripts/build_site.js) and unpacks straight into a
# web root; the Docker image builds the same site inside the Dockerfile.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy_ftp:
        description: Build the site from this branch and upload it over SFTP (no Docker, no release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker image
    if: ${{ !inputs.deploy_ftp }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # to push to ghcr.io
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: images
        name: Pick the registries
        run: |
          {
            echo "images<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/sunspire-saga"
            if [ -n "$DOCKERHUB_USERNAME" ]; then echo "$DOCKERHUB_USERNAME/sunspire-saga"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.images }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release and SFTP deploy
    if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy_ftp
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release on a tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run site

      - name: Zip the site
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          (cd site && zip -r -X "../dist/sunspire-saga-$GITHUB_REF_NAME.zip" .)
          unzip -l dist/*.zip | tail -1

      - name: Create the GitHub Release with the zip attached
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true

      # Only when the FTP secrets are set: mirror the site to the web host over SFTP.
      - if: env.FTP_SERVER != ''
        name: Deploy the site over SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          FTP_KNOWN_HOSTS: ${{ secrets.FTP_KNOWN_HOSTS }}
          FTP_PORT: ${{ vars.FTP_PORT || '22' }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$FTP_KNOWN_HOSTS" ]; then
            echo "$FTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$FTP_PORT" -T 20 "$FTP_SERVER" > ~/.ssh/known_hosts
          fi
          # A manual run is a test run: show the whole SFTP dialogue.
          debug=; [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && debug="debug 3"
          # The SFTP server creates folders that the web server cannot enter (their files then
          # answer 404), so open every folder of the site up to 755 after the upload.
          base="${FTP_PATH:-.}"; base="${base%/}"
          chmods=$(cd site && find . -mindepth 1 -type d ! -name '.*' -printf "chmod 755 \"$base/%P\"\n")
          lftp -u "$FTP_USERNAME" --env-password "sftp://$FTP_SERVER:$FTP_PORT" <<LFTP
          $debug
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 3
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes"
          mirror --reverse --delete --no-perms --parallel=4 --verbose=1 --exclude-glob .* --exclude-glob .*/ --exclude-glob cgi-bin/ site/ "$base"
          $chmods
          bye
          LFTP
