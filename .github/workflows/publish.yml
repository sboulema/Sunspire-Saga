# Publish the game: a Docker image on Docker Hub and GitHub Container Registry, and a zip of the
# built site.
#
#   push to main      ->  images <user>/sunspire-saga and ghcr.io/<owner>/sunspire-saga,
#                         tagged :latest and :sha-<short sha>
#                         + workflow artifact "sunspire-saga-sha-<short sha>" (the site, zipped)
#   push of tag vNN   ->  the same images tagged :vNN and :sha-<short sha>
#                         + a GitHub Release for vNN with sunspire-saga-vNN.zip attached
#                         + the site uploaded over FTP to the web host
#
# GHCR uses the workflow's own GITHUB_TOKEN and always gets the image. Docker Hub is optional: it
# is pushed only when the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are set (an
# access token, Docker Hub -> Account settings -> Personal access tokens, with Read & Write scope).
#
# The FTP deploy is optional too: it runs only on a vNN tag and only when the repository secrets
# FTP_SERVER, FTP_USERNAME and FTP_PASSWORD are set. FTP_PATH (secret, optional) is the
# folder on the server to upload into, "./" by default; the repository variable FTP_PROTOCOL
# (optional) picks ftp, ftps or ftps-legacy, "ftp" by default. The upload is a sync: files that
# are no longer in the site are deleted from that folder, so point it at a folder that holds only
# the site.
#
# The zip is the output of `npm run site` (scripts/build_site.js) and unpacks straight into a
# web root; the Docker image builds the same site inside the Dockerfile.
name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # to push to ghcr.io
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: images
        name: Pick the registries
        run: |
          {
            echo "images<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/sunspire-saga"
            if [ -n "$DOCKERHUB_USERNAME" ]; then echo "$DOCKERHUB_USERNAME/sunspire-saga"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  site-zip:
    name: Static site zip
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release on a tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run site

      - id: version
        name: Pick the release name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="sha-${GITHUB_SHA::7}"; fi
          echo "name=sunspire-saga-$v" >> "$GITHUB_OUTPUT"

      - name: Zip the site
        run: |
          mkdir -p dist
          (cd site && zip -r -X "../dist/${{ steps.version.outputs.name }}.zip" .)
          unzip -l "dist/${{ steps.version.outputs.name }}.zip" | tail -1

      # Every run: the built site as a workflow artifact (GitHub serves it as a zip).
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.name }}
          path: site
          if-no-files-found: error

      # Tags only: a GitHub Release with the zip attached.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true

      # Tags only, and only when the FTP secrets are set: sync the site to the web host.
      - if: startsWith(github.ref, 'refs/tags/v') && env.FTP_SERVER != ''
        name: Deploy the site over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: site/
          server-dir: ${{ secrets.FTP_PATH || './' }}
          state-name: .sunspire-ftp-state.json
